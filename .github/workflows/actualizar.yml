name: Actualizar vídeos

on:
  schedule:
    - cron: "17 */4 * * *"   # cada 4 horas
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-videos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Leer el canal y regenerar el índice
        run: python scripts/actualizar.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Publicar las fichas en WordPress
        run: python scripts/publicar_wordpress.py
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BUSCADOR_URL: ${{ secrets.BUSCADOR_URL }}

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar vídeos"
            git push
          fi
